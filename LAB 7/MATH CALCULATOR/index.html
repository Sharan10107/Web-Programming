<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-shape shape-one"></div>
    <div class="background-shape shape-two"></div>

    <main class="calculator-wrapper">
        <section class="calculator-card">
            <div class="calculator-header">
                <div class="icon">∑</div>
                <div>
                    <h1>Math Calculator</h1>
                    <p>Perform quick and easy mathematical calculations</p>
                </div>
            </div>

            <form id="calculatorForm">
                <div class="input-group">
                    <label for="number1">First Number</label>
                    <input type="number" id="number1" placeholder="Enter first number" step="any">
                </div>

                <div class="operator-section">
                    <label>Select Operation</label>
                    <div class="operations">
                        <button type="button" class="operation active" data-operation="add">+</button>
                        <button type="button" class="operation" data-operation="subtract">−</button>
                        <button type="button" class="operation" data-operation="multiply">×</button>
                        <button type="button" class="operation" data-operation="divide">÷</button>
                    </div>
                </div>

                <div class="input-group">
                    <label for="number2">Second Number</label>
                    <input type="number" id="number2" placeholder="Enter second number" step="any">
                </div>

                <div class="button-row">
                    <button type="submit" class="calculate-btn">Calculate</button>
                    <button type="button" id="clearBtn" class="clear-btn">Clear</button>
                </div>
            </form>

            <div id="errorMessage" class="message error"></div>

            <div class="result-box" id="resultBox">
                <span class="result-label">RESULT</span>
                <div id="result">0</div>
                <p id="calculationText">Enter two numbers and choose an operation.</p>
            </div>

            <div class="history-section">
                <div class="history-heading">
                    <h2>Calculation History</h2>
                    <button type="button" id="clearHistory">Clear History</button>
                </div>
                <ul id="historyList">
                    <li class="empty-history">No calculations yet.</li>
                </ul>
            </div>
        </section>

        <p class="footer-text">HTML • CSS • JavaScript | Interactive Web Programming Project</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
