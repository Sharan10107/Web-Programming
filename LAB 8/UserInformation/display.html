<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display User Information</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>User Details</h2>
        <div id="details">
            <p>Name: <span id="name"></span></p>
            <p>Gender: <span id="gender"></span></p>
            <p>Mobile Number: <span id="mobile"></span></p>
            <p>Email ID: <span id="email"></span></p>
            <p>City: <span id="city"></span></p>
            <p>State: <span id="state"></span></p>
            <p>Country: <span id="country"></span></p>
        </div>
        <button type="button" onclick="window.location.href='index.html'">Go Back</button>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem("userData"));

        if (user) {
            document.getElementById("name").textContent = user.name;
            document.getElementById("gender").textContent = user.gender;
            document.getElementById("mobile").textContent = user.mobile;
            document.getElementById("email").textContent = user.email;
            document.getElementById("city").textContent = user.city;
            document.getElementById("state").textContent = user.state;
            document.getElementById("country").textContent = user.country;
        } else {
            document.getElementById("details").textContent =
                "No user information found. Please fill in the form first.";
        }
    </script>
</body>
</html>
